<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identifikasi Pose Jari - 3 Kelas</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(233, 30, 99, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h2 { margin-top: 0; color: #d81b60; }
    video {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      background: #000;
      object-fit: cover;
      transform: scaleX(-1); /* Efek Mirror Cermin */
    }
    
    /* Tulisan Instruksi Tahan Beberapa Detik */
    .instruction-text {
      font-size: 13px;
      font-weight: bold;
      color: #d81b60;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    button {
      background-color: #e91e63;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background-color: #c2185b; }
    button:disabled { background-color: #f8bbd0; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 13px; color: #888; }
    
    /* Kotak Hasil Dominan */
    .dominant-box {
      margin-top: 15px;
      padding: 15px;
      background: #fce4ec;
      border-radius: 10px;
      border: 2px solid #f8bbd0;
    }
    #dominant-text {
      font-size: 28px;
      font-weight: bold;
      color: #ad1457;
    }

    .result-box { margin-top: 12px; text-align: left; }
    .label-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
    .progress-container {
      background: #f8bbd0;
      border-radius: 6px;
      height: 10px;
      width: 100%;
      margin-top: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Identifikasi Pose Jari</h2>
    <video id="webcam" autoplay playsinline muted></video>
    
    <!-- Tulisan Tahan Beberapa Detik -->
    <div id="hold-instruction" class="instruction-text" style="display:none;">
      ⏱️ Tahan posisi jari beberapa detik...
    </div>

    <button id="toggle-btn" onclick="toggleWebcam()" disabled>Memuat Model...</button>
    <div id="status">Memuat pustaka TensorFlow.js...</div>
    
    <!-- Bagian Hasil 3 Kelas -->
    <div id="main-result-container" style="display:none;">
      <div class="dominant-box">
        <div id="dominant-text">-</div>
      </div>

      <div class="result-box">
        <!-- Kelas 0: Tiga Jari -->
        <div class="label-row">
          <span>Tiga Jari</span>
          <span id="prob-0">0%</span>
        </div>
        <div class="progress-container"><div id="bar-0" class="progress-bar" style="background-color: #ec407a;"></div></div>
        
        <!-- Kelas 1: Lima Jari -->
        <div class="label-row">
          <span>Lima Jari</span>
          <span id="prob-1">0%</span>
        </div>
        <div class="progress-container"><div id="bar-1" class="progress-bar" style="background-color: #ab47bc;"></div></div>

        <!-- Kelas 2: Background -->
        <div class="label-row">
          <span>Background</span>
          <span id="prob-2">0%</span>
        </div>
        <div class="progress-container"><div id="bar-2" class="progress-bar" style="background-color: #78909c;"></div></div>
      </div>
    </div>
  </div>

  <script>
    let model;
    let webcamRunning = false;
    let animFrameId;
    const videoElement = document.getElementById('webcam');
    const MODEL_PATH = './my_model/model.json';

    async function loadModel() {
      try {
        document.getElementById('status').innerText = 'Memuat model AI...';
        model = await tf.loadLayersModel(MODEL_PATH);
        document.getElementById('status').innerText = 'Model siap digunakan.';
        const btn = document.getElementById('toggle-btn');
        btn.innerText = 'Nyalakan Kamera';
        btn.disabled = false;
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'Gagal memuat model. Pastikan folder my_model berada di lokasi yang benar.';
      }
    }

    async function toggleWebcam() {
      const btn = document.getElementById('toggle-btn');
      const holdInstruction = document.getElementById('hold-instruction');

      if (!webcamRunning) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 224, height: 224, facingMode: "user" }, 
            audio: false 
          });
          videoElement.srcObject = stream;
          webcamRunning = true;
          btn.innerText = 'Matikan Kamera';
          document.getElementById('main-result-container').style.display = 'block';
          holdInstruction.style.display = 'block'; // Tampilkan pesan saat kamera aktif

          videoElement.onloadeddata = () => {
            predictLoop();
          };
        } catch (e) {
          alert('Tidak dapat mengakses webcam: ' + e.message);
        }
      } else {
        webcamRunning = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        
        const stream = videoElement.srcObject;
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        videoElement.srcObject = null;
        btn.innerText = 'Nyalakan Kamera';
        document.getElementById('main-result-container').style.display = 'none';
        holdInstruction.style.display = 'none'; // Sembunyikan pesan saat kamera mati
      }
    }

    async function predictLoop() {
      if (!webcamRunning) return;

      if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
        const predictions = tf.tidy(() => {
          const img = tf.browser.fromPixels(videoElement);
          const resized = tf.image.resizeBilinear(img, [224, 224]);
          const normalized = resized.div(tf.scalar(255.0));
          const batched = normalized.expandDims(0);
          return model.predict(batched);
        });

        const data = await predictions.data();
        predictions.dispose();

        const prob0 = Math.min(Math.max((data[0] * 100), 0), 100).toFixed(1);
        const prob1 = Math.min(Math.max((data[1] * 100), 0), 100).toFixed(1);
        const prob2 = Math.min(Math.max((data[2] * 100), 0), 100).toFixed(1);

        // Update progress bar & persentase
        document.getElementById('prob-0').innerText = `${prob0}%`;
        document.getElementById('bar-0').style.width = `${prob0}%`;

        document.getElementById('prob-1').innerText = `${prob1}%`;
        document.getElementById('bar-1').style.width = `${prob1}%`;

        document.getElementById('prob-2').innerText = `${prob2}%`;
        document.getElementById('bar-2').style.width = `${prob2}%`;

        // Prediksi dominan
        const dominantTextElem = document.getElementById('dominant-text');
        if (data[0] > data[1] && data[0] > data[2]) {
          dominantTextElem.innerText = "3";
          dominantTextElem.style.color = "#ad1457";
        } else if (data[1] > data[0] && data[1] > data[2]) {
          dominantTextElem.innerText = "5";
          dominantTextElem.style.color = "#8e24aa";
        } else {
          dominantTextElem.innerText = "-";
          dominantTextElem.style.color = "#78909c";
        }
      }

      animFrameId = requestAnimationFrame(predictLoop);
    }

    window.onload = loadModel;
  </script>
</body>
</html>
